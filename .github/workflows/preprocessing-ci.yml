name: Automate Preprocessing

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  preprocessing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Automate Preprocessing
        run: |
          cd preprocessing
          python automate_Muhammad-Rizal-Hafiyyan.py

      - name: Upload Processed Dataset Artifact
        uses: actions/upload-artifact@v3
        with:
          name: preprocessed-dataset
          path: preprocessing/namadataset_preprocessing/breast_cancer_preprocessing.csv

      - name: Commit Processed Dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add preprocessing/namadataset_preprocessing/breast_cancer_preprocessing.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update preprocessed dataset" && git push)
